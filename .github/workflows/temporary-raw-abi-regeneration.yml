name: Temporary raw ABI regeneration
on:
  push:
    branches:
      - fix/reference-slack-semantics
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
        with:
          version: '1'
      - name: Check out current native header
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: eigenergy/powerio
          ref: main
          path: powerio
      - name: Generate Julia C ABI bindings
        run: |
          julia --project=gen -e 'using Pkg; Pkg.instantiate()'
          julia --project=gen gen/generate.jl powerio/powerio-capi/include/powerio.h
      - name: Commit regenerated raw ABI layer
        run: |
          if git diff --quiet -- src/LibPowerIO.jl; then
            echo "Generated raw ABI layer is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LibPowerIO.jl
          git commit -m "chore: regenerate raw C ABI bindings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
